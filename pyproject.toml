[project]
name = "unlearning-ml"
version = "0.1.0"
description = "A personal machine learning practice repository for rebuilding ML intuition across model families and data types."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nakshatra Kundlas" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
